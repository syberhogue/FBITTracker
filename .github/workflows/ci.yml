name: CI
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --schema public,private --level warning --fail-on warning
      - run: deno check supabase/functions/manage-user/index.ts
